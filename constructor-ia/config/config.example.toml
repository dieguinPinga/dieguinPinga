# Configuración de Constructor IA.
# Copiar a config/config.toml (el instalador lo hace si no existe) y ajustar.
# NO guardar contraseñas ni tokens en este archivo: los usuarios se crean con
#   ~/constructor-ia/bin/constructor-ia adduser diego

[server]
# Solo loopback por defecto. Para acceso directo por Tailscale sin tocar su
# configuración, agregar la IP 100.x de la VivoBook (ver INSTALL.md §6).
listen = ["127.0.0.1"]
port = 8766
# Nombres admitidos en la cabecera Host (protección contra DNS rebinding).
# Un valor que empieza con "." admite cualquier subdominio (p. ej. ".ts.net").
allowed_hosts = ["127.0.0.1", "localhost", ".ts.net"]
# true si se accede por HTTPS (Tailscale Serve) o por http://127.0.0.1 / túnel SSH.
# Poner false solo si se accede por http://100.x.y.z (IP Tailscale directa).
cookie_secure = true
session_idle_hours = 12
session_max_days = 7
max_connections = 32
max_sse_clients = 6

[ollama]
# Instancia CPU dedicada. La instancia principal (11434) está prohibida.
url = "http://127.0.0.1:11435"

[ollama.builder]
name = "qwen3:4b-instruct"
num_ctx = 4096
num_predict = 1536
temperature = 0.2
timeout_s = 300
think = false

[ollama.chat]
# Mismo motor CPU (OLLAMA_MAX_LOADED_MODELS=1): alternar entre modelos implica recargarlos.
# Para evitar recargas puede usarse también "qwen3:4b-instruct".
name = "qwen3:1.7b"
num_ctx = 4096
num_predict = 768
temperature = 0.5
timeout_s = 240
think = false

[ollama.web]
# Modelo para misiones «Página web / Tablero» (varios archivos: necesita más contexto).
# Memoria aproximada de la caché KV de qwen3:4b: ~147 KB por token → 6144 tokens ≈ 0,9 GB
# (además del modelo, ~2,5 GB). Si la VivoBook queda justa de RAM, bajar a 4096/2560.
name = "qwen3:4b-instruct"
num_ctx = 6144
num_predict = 3072
temperature = 0.2
timeout_s = 600
think = false

[engine]
max_attempts = 3
max_attempts_limit = 6

[sandbox]
# Si el autodiagnóstico falla, la ejecución queda bloqueada automáticamente.
enabled = true
python = "/usr/bin/python3"
memory_mb = 256
tasks_max = 32
cpu_percent = 50
timeout_s = 20
case_timeout_s = 5
tmpfs_mb = 32
seccomp = true

[retention]
event_days = 60
max_events_per_mission = 2000
log_max_bytes = 2000000
log_backups = 3

[web]
# Taller Web: generación de sitios y tableros (HTML/CSS/JS locales).
enabled = true
# Vista previa en un ORIGEN SEPARADO (otro puerto, mismas direcciones de escucha que el panel).
# Si el puerto no puede abrirse, la vista previa se deshabilita y queda la descarga ZIP.
preview_enabled = true
preview_port = 8767
# Solo con Tailscale Serve/HTTPS (ver INSTALL.md §6): origen HTTPS de la vista previa
# y origen HTTPS del panel autorizado a enmarcarla.
preview_origin = ""
panel_origins = []
preview_minutes = 120
max_files = 12
max_file_kb = 100
max_total_kb = 400
# Node del sistema para "node --check" dentro del sandbox (debe estar bajo /usr).
# Si no existe, se usa una comprobación heurística de JavaScript.
node = "/usr/bin/node"

[ollama.explorer]
# Modelo del Explorador: respuestas JSON cortas por paso (salida estructurada de Ollama).
name = "qwen3:4b-instruct"
num_ctx = 6144
num_predict = 900
temperature = 0.2
timeout_s = 300
think = false

[explorer]
# Explorador autónomo de bases de datos (solo lectura a través del intermediario).
enabled = true
max_steps = 25          # pasos por misión (tope del formulario)
max_queries = 60        # consultas del agente por misión
max_minutes = 45        # tiempo total por misión
query_timeout_s = 10    # max_statement_time de cada consulta (y KILL QUERY si se excede)
max_rows = 200          # filas devueltas al agente por consulta (sql_select_limit + tope del cliente)
max_result_kb = 256     # bytes por resultado
max_join_size = 20000000  # MariaDB rechaza consultas que estimen examinar más filas
sample_rows = 100000    # tamaño de muestra de las herramientas perfil/frecuentes/relacion
report_num_predict = 1800 # tokens para el informe final (3 aplicaciones con consultas no entran en 900)
decide_num_predict = 384  # etapa A (investigación): JSON pequeño con pregunta, herramienta y argumentos
interpret_num_predict = 512  # etapa B (interpretación): respuesta acotada por el esquema (≤3 hallazgos cortos)
# Las reservas bajan solas si la velocidad medida de Ollama no alcanza el plazo. El mensaje se ajusta a num_ctx.

# Una entrada por base autorizada. La contraseña va en un archivo 0600 aparte (nunca aquí):
#   ~/constructor-ia/bin/constructor-ia explorer-setup prrr_market   (ver EXPLORADOR.md)
# [[explorer.connections]]
# name = "prrr_market"
# database = "prrr_market"
# user = "cia_explorer"
# password_file = "/home/diego/constructor-ia/config/secretos/prrr_market.pass"
# socket = "/run/mysqld/mysqld.sock"
